[project]
name = "nestle-accessibility-platform"
version = "0.1.0"
description = "AI-Driven Multimodal Accessibility Platform for Nestlé - BIT Master Thesis"
requires-python = ">=3.10,<3.14"

dependencies = [
    # API server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    # STT — Topic 2
    "openai-whisper>=20231117",
    "noisereduce>=3.0.2",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    # OCR — Topic 1 stub
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.3.0",
    # RAG layer
    "chromadb>=0.5.0",
    "langchain>=0.1.17",
    "langchain-community>=0.0.38",
    "langchain-ollama>=0.1.0",
    "sentence-transformers>=3.0.1",
    # Utilities
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "ffmpeg-python>=0.2.0",
    "pypdfium2>=5.6.0",
    "faster-whisper>=1.2.1",
    "pyannote-audio>=4.0.4",
    "datasets>=5.0.0",
    "peft>=0.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.uv]
override-dependencies = ["torch==2.6.0+cu124", "torchvision==0.21.0+cu124", "torchaudio==2.6.0+cu124"]
